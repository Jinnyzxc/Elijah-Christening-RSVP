<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Please join us for the Baptism of Elijah on Saturday, 7 November 2026. Kindly RSVP.">
<meta property="og:title" content="Baptism of Elijah – RSVP">
<meta property="og:description" content="Saturday, 7 November 2026 · 9:00 am · Santuario de San Vicente de Paul, Tandang Sora">
<title>Elijah's Baptism RSVP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Poppins:wght@300;400;600;700&display=swap">
<style>
:root {
  --paper: #FDFBF7;
  --ground: #F3E6D6;
  --blush: #F5D8C2;
  --clay: #B07A5A;
  --clay-deep: #8C5A3E;
  --ink: #3A2A22;
  --muted: #7A6558;
  --line: #E7D6C6;
  --font-script: "Kaushan Script", "Brush Script MT", cursive;
  --font-body: "Poppins", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--ground);
  color: var(--ink);
  font-family: var(--font-body);
  font-weight: 300;
  font-size: 15px;
  line-height: 1.6;
  padding: 32px 16px 48px;
}
.card {
  position: relative;
  max-width: 560px;
  margin: 0 auto;
  background: var(--paper);
  border-radius: 6px;
  box-shadow: 0 18px 50px -24px rgba(140, 90, 62, .45);
  overflow: hidden;
  padding: 0 clamp(20px, 6vw, 44px) 36px;
}
.invite-wrap {
  position: relative;
  overflow: hidden;
  width: calc(100% + 2 * clamp(20px, 6vw, 44px));
  margin: 0 calc(-1 * clamp(20px, 6vw, 44px));
}
.invite { display: block; width: 100%; max-width: none; height: auto; }
.rsvp-head {
  text-align: center;
  padding-top: 28px;
  margin-top: 4px;
  border-top: 1px solid var(--line);
}
.rsvp-head h1 { font-size: clamp(2.2rem, 8vw, 2.8rem); }
.rsvp-head .pre { color: var(--muted); font-size: .95rem; margin-top: 4px; }
.blob { position: absolute; border-radius: 50% 40% 60% 45%; background: var(--blush); opacity: .55; pointer-events: none; }
.blob.a { width: 160px; height: 140px; top: -50px; left: -60px; }
.blob.b { width: 120px; height: 150px; bottom: -40px; right: -50px; }
.sparkle { position: absolute; top: 26px; right: 26px; width: 74px; height: 74px; color: var(--clay); }
header { position: relative; }
.pre { font-size: 1rem; margin: 0; }
h1 {
  font-family: var(--font-script);
  font-weight: 400;
  color: var(--clay);
  font-size: clamp(2.6rem, 10vw, 3.6rem);
  line-height: 1.05;
  margin: 4px 0 0;
}
.details {
  position: relative;
  margin: 24px 0 8px;
  padding: 16px 0;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  display: grid;
  gap: 6px;
  font-size: .92rem;
}
.details b { font-weight: 600; }
.details .date { font-weight: 700; font-size: 1rem; }
form { position: relative; display: grid; gap: 20px; margin-top: 24px; }
.label {
  display: block;
  font-size: .72rem;
  font-weight: 600;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--clay-deep);
  margin-bottom: 8px;
}
input[type="text"], select, textarea {
  width: 100%;
  font: inherit;
  font-weight: 400;
  color: var(--ink);
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 11px 13px;
}
textarea { min-height: 84px; resize: vertical; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible {
  outline: 2px solid var(--clay);
  outline-offset: 2px;
}
fieldset { border: 0; padding: 0; margin: 0; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.choice { position: relative; }
.choice input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.choice span {
  display: flex; align-items: center; justify-content: center; text-align: center;
  min-height: 52px; padding: 10px 12px;
  border: 1px solid var(--line); border-radius: 8px; background: #fff; font-weight: 400;
}
.choice input:checked + span { background: var(--clay); border-color: var(--clay); color: #fff; font-weight: 600; }
.choice input:focus-visible + span { outline: 2px solid var(--clay); outline-offset: 2px; }
.checks { display: grid; gap: 8px; }
.check { display: flex; gap: 10px; align-items: flex-start; font-weight: 400; cursor: pointer; }
.check input { accent-color: var(--clay); width: 18px; height: 18px; margin-top: 3px; flex: none; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 420px) { .choices, .row { grid-template-columns: 1fr; } }
[hidden] { display: none !important; }
button {
  font: inherit; font-weight: 600; border: 0; border-radius: 999px;
  padding: 13px 26px; background: var(--clay-deep); color: #fff; cursor: pointer;
  justify-self: start;
}
button:hover { background: var(--clay); }
button:disabled { opacity: .6; cursor: wait; }
.err { color: #A23B2A; font-size: .85rem; font-weight: 400; margin-top: 6px; }
.thanks { position: relative; text-align: center; padding: 28px 0 8px; }
.thanks h2 { font-family: var(--font-script); font-weight: 400; color: var(--clay); font-size: 2.2rem; margin: 0 0 8px; }
.thanks p { margin: 0 auto 16px; max-width: 34ch; }
.link { background: none; color: var(--clay-deep); padding: 6px 10px; text-decoration: underline; justify-self: center; }
.link:hover { background: none; color: var(--clay); }
footer { position: relative; text-align: center; margin-top: 22px; font-size: .8rem; color: var(--muted); }

/* ---------- Opening animation ---------- */
.intro {
  position: fixed; inset: 0; z-index: 50;
  background: var(--ground);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
  padding: 16px;
  transition: opacity .7s ease;
  cursor: pointer;
}
.intro.gone { opacity: 0; pointer-events: none; }
.intro-title { font-family: var(--font-script); color: var(--clay); font-size: clamp(1.8rem, 7vw, 2.4rem); margin: 0; transition: opacity .4s; }
.intro-skip { font-size: .8rem; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; transition: opacity .4s; }
.intro.opening .intro-title, .intro.opening .intro-skip { opacity: 0; }
.env { position: relative; width: min(76vw, 320px); aspect-ratio: 1.45; perspective: 1000px; margin-top: 60px; }
.env-back { position: absolute; inset: 0; background: #C48D6D; border-radius: 6px; box-shadow: 0 20px 40px -18px rgba(140, 90, 62, .6); }
.env-card {
  position: absolute; left: 7%; right: 7%; top: 6%; height: 88%;
  background: var(--paper) center top / 100% auto no-repeat;
  border-radius: 3px;
  box-shadow: 0 6px 16px -8px rgba(58, 42, 34, .5);
  z-index: 2;
  transition: transform 1.1s cubic-bezier(.22, .9, .3, 1), height 1.1s cubic-bezier(.22, .9, .3, 1);
}
.env-front {
  position: absolute; inset: 0; z-index: 3; border-radius: 6px;
  background: #D9A688;
  clip-path: polygon(0 0, 50% 56%, 100% 0, 100% 100%, 0 100%);
}
.env-flap {
  position: absolute; left: 0; right: 0; top: 0; height: 60%; z-index: 4;
  background: #CB9575;
  clip-path: polygon(0 0, 100% 0, 50% 100%);
  transform-origin: top center;
  transition: transform .6s ease-in, z-index 0s .3s;
}
.seal {
  position: absolute; left: 50%; top: 60%; z-index: 5;
  width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%;
  background: var(--clay-deep); color: #FBEFE4;
  display: grid; place-items: center;
  font-family: var(--font-script); font-size: 1.4rem;
  box-shadow: 0 3px 8px rgba(58, 42, 34, .35);
  transition: opacity .3s, transform .3s;
}
.intro.opening .seal { opacity: 0; transform: scale(.6); }
.intro.opening .env-flap { transform: rotateX(180deg); z-index: 1; }
.intro.rising .env-card { height: 210%; transform: translateY(-62%); }

/* ---------- Page reveal ---------- */
.card { opacity: 1; }
body.animating .card { opacity: 0; transform: translateY(24px) scale(.98); }
body.revealed .card { animation: rise .9s cubic-bezier(.22, .9, .3, 1) both; }
body.revealed .rsvp-head, body.revealed form > * { animation: fadeUp .7s ease both; }
body.revealed .rsvp-head { animation-delay: .5s; }
body.revealed form > *:nth-child(1) { animation-delay: .6s; }
body.revealed form > *:nth-child(2) { animation-delay: .7s; }
body.revealed form > *:nth-child(3) { animation-delay: .8s; }
body.revealed form > *:nth-child(4) { animation-delay: .9s; }
body.revealed form > *:nth-child(5) { animation-delay: 1s; }
@keyframes rise { from { opacity: 0; transform: translateY(24px) scale(.98); } to { opacity: 1; transform: none; } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

/* light sweep across the invite, once */
.invite-wrap::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(105deg, transparent 35%, rgba(255, 255, 255, .55) 50%, transparent 65%);
  transform: translateX(-120%);
}
body.revealed .invite-wrap::after { animation: sweep 1.6s ease-in-out .9s both; }
@keyframes sweep { to { transform: translateX(120%); } }

/* twinkling glints over the invite's sparkles */
.glint {
  position: absolute; width: 6%; aspect-ratio: 1; pointer-events: none;
  background: radial-gradient(circle, #fff 0 12%, rgba(255, 255, 255, .0) 13%),
              conic-gradient(from 45deg, transparent 0 5%, #fff 5% 7%, transparent 7% 30%, #fff 30% 32%, transparent 32% 55%, #fff 55% 57%, transparent 57% 80%, #fff 80% 82%, transparent 82%);
  -webkit-mask: radial-gradient(circle, #000 0 45%, transparent 50%);
          mask: radial-gradient(circle, #000 0 45%, transparent 50%);
  filter: drop-shadow(0 0 3px rgba(255, 236, 214, .95));
  opacity: 0; transform: scale(.3) rotate(0deg);
  animation: twinkle 3.2s ease-in-out infinite;
}
.g1 { left: 73%; top: 10%; animation-delay: .2s; }
.g2 { left: 85%; top: 7.5%; width: 4.5%; animation-delay: 1.3s; }
.g3 { left: 79%; top: 17%; width: 4%; animation-delay: 2.1s; }
.g4 { left: 48%; top: 46%; width: 4%; animation-delay: 2.7s; }
@keyframes twinkle {
  0%, 60%, 100% { opacity: 0; transform: scale(.3) rotate(0deg); }
  75% { opacity: 1; transform: scale(1) rotate(45deg); }
  90% { opacity: 0; transform: scale(.5) rotate(90deg); }
}

@media (prefers-reduced-motion: reduce) {
  .intro { display: none; }
  body.animating .card { opacity: 1; transform: none; }
  .glint, .invite-wrap::after, body.revealed .card, body.revealed .rsvp-head, body.revealed form > * { animation: none !important; }
}
</style>
</head>
<body class="animating">
<div class="intro" id="intro" aria-hidden="true">
  <p class="intro-title">You're invited</p>
  <div class="env">
    <div class="env-back"></div>
    <div class="env-card" id="envCard"></div>
    <div class="env-front"></div>
    <div class="env-flap"></div>
    <div class="seal">E</div>
  </div>
  <span class="intro-skip">Tap to skip</span>
</div>
<main class="card">
  <div class="blob b"></div>

  <div class="invite-wrap">
  <img class="invite" src="invite.jpg" width="560" height="790" alt="Please join us for the Baptism of Elijah. Saturday, 7 November 2026, 9:00 am. Church: Santuario de San Vicente de Paul, Tandang Sora. Reception: Sangkalan Restaurant, Visayas Avenue.">
    <span class="glint g1" aria-hidden="true"></span>
    <span class="glint g2" aria-hidden="true"></span>
    <span class="glint g3" aria-hidden="true"></span>
    <span class="glint g4" aria-hidden="true"></span>
  </div>

  <header class="rsvp-head">
    <h1>Kindly RSVP</h1>
    <p class="pre">Let us know if you can celebrate with us.</p>
  </header>

  <form id="rsvp" novalidate>
    <div>
      <label class="label" for="name">Your name</label>
      <input type="text" id="name" maxlength="100" autocomplete="name" placeholder="e.g. Tita Marivic Santos">
      <div class="err" id="nameErr" hidden>Please add your name so the family knows who's replying.</div>
    </div>

    <fieldset>
      <legend class="label">Will you be there?</legend>
      <div class="choices">
        <label class="choice"><input type="radio" name="attend" id="attendYes" value="yes" checked><span>Joyfully attending</span></label>
        <label class="choice"><input type="radio" name="attend" id="attendNo" value="no"><span>Regretfully can't make it</span></label>
      </div>
    </fieldset>

    <div class="row" id="yesFields">
      <div>
        <label class="label" for="count">Number of guests</label>
        <select id="count">
          <option value="1">1 (just me)</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
          <option value="6">6</option>
        </select>
      </div>
      <div>
        <span class="label">Joining us at</span>
        <div class="checks">
          <label class="check"><input type="checkbox" id="atChurch" checked> Church (9:00 am)</label>
          <label class="check"><input type="checkbox" id="atReception" checked> Reception</label>
        </div>
      </div>
    </div>

    <div>
      <label class="label" for="note">A message for Elijah (optional)</label>
      <textarea id="note" maxlength="1000" placeholder="Wishes, blessings, or a note for the family"></textarea>
    </div>

    <div>
      <button type="submit" id="sendBtn">Send RSVP</button>
      <div class="err" id="sendErr" hidden></div>
    </div>
  </form>

  <section class="thanks" id="thanks" hidden aria-live="polite">
    <h2>Salamat!</h2>
    <p id="thanksText">Your RSVP has been received.</p>
    <button type="button" class="link" id="againBtn">Send another RSVP</button>
  </section>

  <footer>With joyful hearts, thank you for celebrating with us.</footer>
</main>

<script>
(function () {
  var body = document.body, intro = document.getElementById('intro');
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var done = false, timers = [];
  function finish() {
    if (done) return; done = true;
    timers.forEach(clearTimeout);
    intro.classList.add('gone');
    body.classList.remove('animating');
    body.classList.add('revealed');
    setTimeout(function () { intro.remove(); }, 800);
  }
  if (reduce) { intro.remove(); body.classList.remove('animating'); return; }
  document.getElementById('envCard').style.backgroundImage = 'url("' + document.querySelector('.invite').src + '")';
  intro.addEventListener('click', finish);
  timers.push(setTimeout(function () { intro.classList.add('opening'); }, 900));
  timers.push(setTimeout(function () { intro.classList.add('rising'); }, 1600));
  timers.push(setTimeout(finish, 3100));
})();
</script>
<script>
// Paste your Apps Script web app URL here (it ends in /exec)
var RSVP_ENDPOINT = 'https://script.google.com/macros/s/AKfycby2M9byxs6SsM6wq5TyHOtDGi0wLGTiVG4mWvO-kMIjXf7cseDqZ-10_RFgSvW87_8U/exec';
</script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var form = $('rsvp');

  function attending() { return $('attendYes').checked; }

  function toggle() { $('yesFields').hidden = !attending(); }
  form.addEventListener('change', toggle);
  $('name').addEventListener('input', function () { $('nameErr').hidden = true; });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var name = $('name').value.trim();
    if (!name) { $('nameErr').hidden = false; $('name').focus(); return; }

    var data = {
      name: name,
      attending: attending() ? 'yes' : 'no',
      guests: $('count').value,
      church: $('atChurch').checked,
      reception: $('atReception').checked,
      message: $('note').value.trim()
    };

    var btn = $('sendBtn');
    btn.disabled = true;
    btn.textContent = 'Sending…';
    $('sendErr').hidden = true;

    function showError(msg) {
      btn.disabled = false;
      btn.textContent = 'Send RSVP';
      $('sendErr').textContent = msg;
      $('sendErr').hidden = false;
    }

    // Plain-text body avoids a CORS preflight, which Apps Script can't answer
    fetch(RSVP_ENDPOINT, { method: 'POST', body: JSON.stringify(data) })
      .then(function (res) { return res.json(); })
      .then(function (out) {
        if (!out || !out.ok) throw new Error(out && out.error ? out.error : 'Something went wrong.');
        $('thanksText').textContent = data.attending === 'yes'
          ? 'We can\u2019t wait to celebrate with you on 7 November!'
          : 'Thank you for letting us know. We\u2019ll miss you!';
        form.hidden = true;
        $('thanks').hidden = false;
        btn.disabled = false;
        btn.textContent = 'Send RSVP';
      })
      .catch(function (err) {
        showError((err && err.message ? err.message : 'Something went wrong.') + ' Please check your connection and try again.');
      });
  });

  $('againBtn').addEventListener('click', function () {
    form.reset();
    toggle();
    $('thanks').hidden = true;
    form.hidden = false;
    $('name').focus();
  });

  toggle();
})();
</script>
</body>
</html>
